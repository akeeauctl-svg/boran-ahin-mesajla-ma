<!DOCTYPE html>
<html>

<head>
    <title>Mesajlar</title>
</head>

<body>

<h1>Mesajlar</h1>

<p>
<a href="index.html">Ana Sayfa</a>
</p>

<hr>

<p>Adınız:</p>

<input type="text" id="isim">

<p>Mesajınız:</p>

<textarea id="mesaj" rows="5" cols="30"
placeholder="Mesajınızı yazın..."></textarea>

<p>
<input type="button" value="Gonder" onclick="gonder()">
</p>

<hr>

<h2>Mesajlar</h2>

<div id="mesajlar">
Mesajlar yukleniyor...
</div>


<script>

var SUPABASE_URL =
"https://ulnleugeesffurynrroe.supabase.co";

var SUPABASE_KEY =
"sb_publishable_nomEv3vvtdq58VPOO6wDbw_loVtcMwl";


// KAYITLI ISMI GETIR
var kayitliIsim = localStorage.getItem("kullanici_ismi");

if (kayitliIsim) {

    document.getElementById("isim").value = kayitliIsim;

    // Direkt mesaj kutusuna geç
    document.getElementById("mesaj").focus();

}


// MESAJ GONDER
function gonder() {

    var isim =
        document.getElementById("isim").value.trim();

    var mesaj =
        document.getElementById("mesaj").value.trim();


    if (isim == "" || mesaj == "") {

        alert("Lutfen isim ve mesaj yazin.");
        return;

    }


    // ISMI KAYDET
    localStorage.setItem("kullanici_ismi", isim);


    fetch(
        SUPABASE_URL + "/rest/v1/messages",
        {

            method: "POST",

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Prefer":
                    "return=minimal"

            },

            body: JSON.stringify({

                username: isim,

                message: mesaj

            })

        }

    )

    .then(function(response) {

        if (response.ok) {

            alert("Mesajiniz gonderildi!");

            // SADECE MESAJ KUTUSUNU TEMIZLE
            document.getElementById("mesaj").value = "";

            // ISIM KALMAYA DEVAM EDER
            document.getElementById("mesaj").focus();

            mesajlariGetir();

        }

        else {

            response.text().then(function(hata) {

                alert(
                    "MESAJ GONDERILEMEDI:\n\n" +
                    hata
                );

                console.log(hata);

            });

        }

    })

    .catch(function(hata) {

        alert(
            "Baglanti hatasi:\n\n" +
            hata
        );

    });

}


// MESAJLARI GETIR
function mesajlariGetir() {

    fetch(
        SUPABASE_URL +
        "/rest/v1/messages?select=*&order=created_at.desc",

        {

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + SUPABASE_KEY

            }

        }

    )

    .then(function(response) {

        return response.json();

    })

    .then(function(data) {

        var alan =
            document.getElementById("mesajlar");

        alan.innerHTML = "";


        for (var i = 0; i < data.length; i++) {

            alan.innerHTML +=

                "<p><b>" +
                data[i].username +
                "</b></p>" +

                "<p>" +
                data[i].message +
                "</p>";


            if (data[i].reply) {

                alan.innerHTML +=

                    "<p><b>Cevap:</b> " +
                    data[i].reply +
                    "</p>";

            }


            alan.innerHTML += "<hr>";

        }

    })

    .catch(function(hata) {

        document.getElementById("mesajlar").innerHTML =
            "Mesajlar yuklenemedi.";

        console.log(hata);

    });

}


// SAYFA ACILINCA MESAJLARI GETIR
mesajlariGetir();

</script>

</body>

</html>
