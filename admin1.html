<!DOCTYPE html>
<html>

<head>
    <title>Mesaj Yönetimi</title>
</head>

<body>

<h1>Mesaj Yönetimi</h1>

<p>
<a href="index.html">Ana Sayfa</a>
</p>

<hr>

<div id="mesajlar">
Mesajlar yükleniyor...
</div>

<script>

var SUPABASE_URL = "https://ulnleugeesffurynrroe.supabase.co";

var SUPABASE_KEY =
"sb_publishable_nomEv3vvtdq58VPOO6wDbw_loVtcMwl";


function mesajlariGetir() {

    fetch(
        SUPABASE_URL +
        "/rest/v1/messages?select=*&order=created_at.desc",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    )

    .then(function(response) {
        return response.json();
    })

    .then(function(data) {

        var alan = document.getElementById("mesajlar");

        alan.innerHTML = "";

        for (var i = 0; i < data.length; i++) {

            alan.innerHTML +=
                "<div>" +

                "<h3>" +
                data[i].username +
                "</h3>" +

                "<p>" +
                data[i].message +
                "</p>";

            if (data[i].reply) {

                alan.innerHTML +=
                    "<p><b>Mevcut cevap:</b> " +
                    data[i].reply +
                    "</p>";

            }

            alan.innerHTML +=

                "<textarea id='cevap" + data[i].id +
                "' rows='4' cols='40' " +
                "placeholder='Cevabınızı yazın...'></textarea>" +

                "<br><br>" +

                "<button onclick='cevapGonder(" +
                data[i].id +
                ")'>Cevap Gönder</button>" +

                "<hr>" +

                "</div>";

        }

    });

}


function cevapGonder(id) {

    var cevap =
        document.getElementById("cevap" + id).value;

    if (cevap == "") {

        alert("Lütfen cevap yazın.");
        return;

    }

    fetch(
        SUPABASE_URL +
        "/rest/v1/messages?id=eq." + id,
        {

            method: "PATCH",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                reply: cevap
            })

        }
    )

    .then(function(response) {

        if (response.ok) {

            alert("Cevap gönderildi!");

            mesajlariGetir();

        } else {

            response.text().then(function(hata) {

                alert(
                    "Cevap gönderilemedi:\n\n" +
                    hata
                );

                console.log(hata);

            });

        }

    })

    .catch(function(hata) {

        alert(
            "Bağlantı hatası:\n\n" +
            hata
        );

    });

}


mesajlariGetir();

</script>

</body>

</html>
