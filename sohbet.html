```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesaj</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f1f1;
}

header {
    background: #075e54;
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 21px;
    font-weight: bold;
}

.menu {
    background: white;
    padding: 10px;
    display: flex;
    gap: 8px;
}

.menu button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
}

.menu .active {
    background: #075e54;
    color: white;
}

.page {
    display: none;
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.page.active {
    display: block;
}

input,
textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 12px;
    font-size: 16px;
    margin-bottom: 9px;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.send {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #075e54;
    color: white;
    font-size: 16px;
}

.card {
    background: white;
    padding: 14px;
    border-radius: 10px;
    margin-top: 12px;
}

.incoming {
    background: #eeeeee;
    padding: 11px;
    border-radius: 9px;
    white-space: pre-wrap;
}

.reply {
    background: #dcf8c6;
    padding: 11px;
    border-radius: 9px;
    margin-top: 8px;
    white-space: pre-wrap;
}

.name {
    font-weight: bold;
    color: #075e54;
    margin-bottom: 8px;
}

.date {
    color: #888;
    font-size: 11px;
    margin-top: 7px;
}

button:disabled {
    background: #999;
}

.empty {
    text-align: center;
    color: #777;
    margin-top: 25px;
}
</style>
</head>

<body>

<header>💬 Mesaj</header>

<div class="menu">

<button id="userTab"
        class="active"
        onclick="openPage('user')">
    📩 Mesaj
</button>

<button id="adminTab"
        onclick="openPage('admin')">
    🔐 Admin
</button>

</div>


<!-- KULLANICI -->

<div id="userPage" class="page active">

<h3>Mesaj Gönder</h3>

<input
    id="username"
    type="text"
    placeholder="İsmin"
    autocomplete="off">

<textarea
    id="message"
    placeholder="Mesajını yaz..."
    autocomplete="off"></textarea>

<button
    id="sendButton"
    class="send"
    onclick="sendMessage()">
    Gönder
</button>

<div id="userMessages"></div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="page">

<h3>Admin</h3>

<div id="adminMessages">
    <div class="empty">
        Mesajlar yükleniyor...
    </div>
</div>

</div>


<script>

/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
"https://expimhpykwokmdfjaoao.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_h4XZ3Fen_NE632-RQC-lDQ_vNN4SfsL";


/* ==========================
   GÜVENLİ METİN
========================== */

function safe(text) {

    if (!text) return "";

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================
   SAYFA
========================== */

function openPage(page) {

    document
        .getElementById("userPage")
        .classList.remove("active");

    document
        .getElementById("adminPage")
        .classList.remove("active");

    document
        .getElementById("userTab")
        .classList.remove("active");

    document
        .getElementById("adminTab")
        .classList.remove("active");


    if (page === "user") {

        document
            .getElementById("userPage")
            .classList.add("active");

        document
            .getElementById("userTab")
            .classList.add("active");

        loadUserMessages();

    }


    if (page === "admin") {

        document
            .getElementById("adminPage")
            .classList.add("active");

        document
            .getElementById("adminTab")
            .classList.add("active");

        loadAdminMessages();

    }

}


/* ==========================
   İSİM
========================== */

const savedName =
localStorage.getItem("my_name");

if (savedName) {

    document.getElementById("username").value =
        savedName;

}


/* ==========================
   MESAJ GÖNDER
========================== */

async function sendMessage() {

    const username =
        document.getElementById("username")
        .value
        .trim();

    const box =
        document.getElementById("message");

    const message =
        box.value.trim();

    const button =
        document.getElementById("sendButton");


    if (!username) {

        alert("İsmini yaz.");

        return;
    }


    if (!message) {

        alert("Mesajını yaz.");

        return;
    }


    localStorage.setItem(
        "my_name",
        username
    );


    button.disabled = true;
    button.innerText = "Gönderiliyor...";


    try {

        const response = await fetch(
            SUPABASE_URL + "/messages2",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY,
                    "Content-Type":
                        "application/json",
                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({
                    username: username,
                    message: message
                })
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Gönderilemedi:\n\n" +
                error
            );

            return;
        }


        box.value = "";

        loadUserMessages();

    }

    catch (error) {

        alert(
            "İnternet bağlantısı hatası."
        );

        console.log(error);

    }

    finally {

        button.disabled = false;
        button.innerText = "Gönder";

    }

}


/* ==========================
   KULLANICI MESAJLARI
========================== */

async function loadUserMessages() {

    const username =
        document.getElementById("username")
        .value
        .trim();


    if (!username) return;


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/messages2?select=*" +
            "&username=eq." +
            encodeURIComponent(username) +
            "&order=created_at.asc",

            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) return;


        const messages =
            await response.json();


        const area =
            document.getElementById(
                "userMessages"
            );


        area.innerHTML = "";


        if (messages.length === 0) {

            area.innerHTML =
                '<div class="empty">Henüz mesaj yok.</div>';

            return;
        }


        messages.forEach(function(item) {

            let html =

                '<div class="card">' +

                '<div class="incoming">' +
                safe(item.message) +
                '</div>' +

                '<div class="date">' +
                new Date(
                    item.created_at
                ).toLocaleString("tr-TR") +
                '</div>';


            if (item.reply) {

                html +=

                    '<div class="reply">' +
                    '<b>Yanıt:</b><br>' +
                    safe(item.reply) +
                    '</div>';

            }


            html += '</div>';


            area.innerHTML += html;

        });

    }

    catch (error) {

        console.log(error);

    }

}


/* ==========================
   ADMIN MESAJLARI
========================== */

async function loadAdminMessages() {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/messages2?select=*&order=created_at.desc",

            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            console.log(
                await response.text()
            );

            return;
        }


        const messages =
            await response.json();


        const area =
            document.getElementById(
                "adminMessages"
            );


        messages.forEach(function(item) {

            /*
             * Kart zaten varsa dokunmuyoruz.
             * Böylece yazılan cevap kaybolmaz.
             */

            let card =
                document.getElementById(
                    "admin-" + item.id
                );


            if (card) {

                if (item.reply) {

                    const replyArea =
                        card.querySelector(
                            ".adminReply"
                        );

                    if (replyArea) {

                        replyArea.innerHTML =
                            '<div class="reply">' +
                            '<b>Sen:</b><br>' +
                            safe(item.reply) +
                            '</div>';

                    }

                }

                return;
            }


            card =
                document.createElement("div");

            card.className = "card";

            card.id =
                "admin-" + item.id;


            let replyHTML = "";

            if (item.reply) {

                replyHTML =
                    '<div class="reply">' +
                    '<b>Sen:</b><br>' +
                    safe(item.reply) +
                    '</div>';

            }


            card.innerHTML =

                '<div class="name">' +
                '👤 ' +
                safe(item.username) +
                '</div>' +

                '<div class="incoming">' +
                safe(item.message) +
                '</div>' +

                '<div class="adminReply">' +
                replyHTML +
                '</div>' +

                '<textarea ' +
                'id="reply-' +
                item.id +
                '" ' +
                'placeholder="Cevap yaz..."' +
                '></textarea>' +

                '<button ' +
                'class="send" ' +
                'id="replyButton-' +
                item.id +
                '" ' +
                'onclick="sendReply(' +
                item.id +
                ')">' +
                'Yanıtla' +
                '</button>' +

                '<div class="date">' +
                new Date(
                    item.created_at
                ).toLocaleString("tr-TR") +
                '</div>';


            area.appendChild(card);

        });

    }

    catch (error) {

        console.log(error);

    }

}


/* ==========================
   ADMIN CEVAP
========================== */

async function sendReply(id) {

    const box =
        document.getElementById(
            "reply-" + id
        );

    const button =
        document.getElementById(
            "replyButton-" + id
        );


    const reply =
        box.value.trim();


    if (!reply) {

        alert("Cevap yaz.");

        return;
    }


    button.disabled = true;
    button.innerText =
        "Gönderiliyor...";


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/messages2?id=eq." +
            id,

            {
                method: "PATCH",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY,
                    "Content-Type":
                        "application/json",
                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({
                    reply: reply
                })
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Yanıt gönderilemedi:\n\n" +
                error
            );

            return;
        }


        box.value = "";


        const card =
            document.getElementById(
                "admin-" + id
            );


        const replyArea =
            card.querySelector(
                ".adminReply"
            );


        replyArea.innerHTML =
            '<div class="reply">' +
            '<b>Sen:</b><br>' +
            safe(reply) +
            '</div>';

    }

    catch (error) {

        alert(
            "Bağlantı hatası."
        );

        console.log(error);

    }

    finally {

        button.disabled = false;
        button.innerText =
            "Yanıtla";

    }

}


/* ==========================
   30 SANİYE KONTROL
========================== */

setInterval(function() {

    const userPage =
        document
        .getElementById("userPage")
        .classList
        .contains("active");


    const adminPage =
        document
        .getElementById("adminPage")
        .classList
        .contains("active");


    /*
     * Kullanıcı mesaj kutusuna yazıyorsa
     * yenileme yapma.
     */

    const messageBox =
        document.getElementById("message");


    if (
        userPage &&
        document.activeElement !== messageBox
    ) {

        loadUserMessages();

    }


    /*
     * Admin herhangi bir cevap kutusuna
     * yazıyorsa yenileme yapma.
     */

    if (adminPage) {

        const active =
            document.activeElement;

        if (
            !active ||
            active.tagName !== "TEXTAREA"
        ) {

            loadAdminMessages();

        }

    }

}, 30000);


/* İlk yükleme */

if (savedName) {
    loadUserMessages();
}

</script>

</body>
</html>
