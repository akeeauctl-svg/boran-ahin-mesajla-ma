```html
<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mesajlarım</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #efeae2;
    min-height: 100vh;
}

header {
    background: #075e54;
    color: white;
    padding: 17px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

#hosgeldin {
    margin-top: 5px;
    font-size: 13px;
}

#mesajlar {
    max-width: 650px;
    margin: auto;
    padding: 20px 15px 120px;
}

.mesaj {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-bottom: 15px;
}

.giden {
    background: #d9fdd3;
    padding: 11px 14px;
    border-radius: 12px 12px 3px 12px;
    max-width: 85%;
    word-wrap: break-word;
    font-size: 15px;
}

.cevap {
    align-self: flex-start;
    background: white;
    padding: 11px 14px;
    border-radius: 12px 12px 12px 3px;
    max-width: 85%;
    margin-top: 7px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    word-wrap: break-word;
    font-size: 15px;
}

.cevap-baslik {
    font-size: 12px;
    font-weight: bold;
    color: #075e54;
    margin-bottom: 4px;
}

.gonderme {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 10px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.12);
}

.gonderme-ic {
    max-width: 650px;
    margin: auto;
    display: flex;
    gap: 8px;
}

textarea {
    flex: 1;
    min-height: 45px;
    max-height: 130px;
    resize: none;
    border: 1px solid #ddd;
    border-radius: 22px;
    padding: 12px 16px;
    font-family: Arial;
    font-size: 15px;
    outline: none;
}

textarea:focus {
    border-color: #075e54;
}

button {
    width: 80px;
    border: none;
    border-radius: 22px;
    background: #075e54;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

#durum {
    text-align: center;
    font-size: 13px;
    margin-top: 5px;
}

@media (max-width: 600px) {

    #mesajlar {
        padding-left: 10px;
        padding-right: 10px;
    }

    .giden,
    .cevap {
        max-width: 90%;
    }

}

</style>

</head>


<body>


<header>

<h1>Mesajlarım</h1>

<div id="hosgeldin"></div>

</header>


<div id="mesajlar">
Yükleniyor...
</div>


<div class="gonderme">

<div class="gonderme-ic">

<textarea
id="mesaj"
placeholder="Mesaj yaz..."
></textarea>

<button onclick="gonder()">
Gönder
</button>

</div>

<div id="durum"></div>

</div>


<script>


/* YENİ SUPABASE */

var SUPABASE_URL =
"https://expimhpykwokmdfjaoao.supabase.co/rest/v1";

var SUPABASE_KEY =
"sb_publishable_h4XZ3Fen_NE632-RQC-lDQ_vNN4SfsL";


/* KULLANICI İSMİ */

var isim =
localStorage.getItem("kullanici_ismi");


if (!isim) {

    isim = prompt("Adınızı yazın:");

    if (isim) {

        isim = isim.trim();

        if (isim != "") {

            localStorage.setItem(
                "kullanici_ismi",
                isim
            );

        }

    }

}


if (isim) {

    document.getElementById("hosgeldin").innerHTML =
        "Merhaba, " + guvenli(isim);

}


/* MESAJ GÖNDER */

function gonder() {

    var kutu =
        document.getElementById("mesaj");

    var mesaj =
        kutu.value.trim();


    if (!isim) {

        alert("İsim bulunamadı.");

        return;

    }


    if (!mesaj) {

        return;

    }


    document.getElementById("durum").innerHTML =
        "Gönderiliyor...";


    fetch(
        SUPABASE_URL + "/messages2",
        {

            method: "POST",

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Prefer":
                    "return=minimal"

            },

            body: JSON.stringify({

                username: isim,

                message: mesaj

            })

        }

    )

    .then(function(response) {

        if (response.ok) {

            kutu.value = "";

            document.getElementById("durum").innerHTML =
                "✓ Mesajınız gönderildi";

            mesajlariGetir();

        }

        else {

            response.text().then(function(hata) {

                document.getElementById("durum").innerHTML =
                    "Mesaj gönderilemedi.";

                alert(
                    "Supabase hatası:\n\n" +
                    hata
                );

                console.log(hata);

            });

        }

    })

    .catch(function(hata) {

        document.getElementById("durum").innerHTML =
            "Bağlantı hatası.";

        alert("Bağlantı hatası:\n\n" + hata);

    });

}


/* MESAJLARI GETİR */

function mesajlariGetir() {

    if (!isim) {
        return;
    }


    fetch(

        SUPABASE_URL +
        "/messages2?select=*&username=eq." +
        encodeURIComponent(isim) +
        "&order=created_at.asc",

        {

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + SUPABASE_KEY

            }

        }

    )

    .then(function(response) {

        return response.json();

    })

    .then(function(data) {

        var alan =
            document.getElementById("mesajlar");

        alan.innerHTML = "";


        if (data.length == 0) {

            alan.innerHTML =
                "<p style='text-align:center;color:#777'>" +
                "Henüz mesaj göndermediniz." +
                "</p>";

            return;

        }


        for (var i = 0; i < data.length; i++) {

            var m = data[i];

            var html =

                "<div class='mesaj'>" +

                "<div class='giden'>" +
                guvenli(m.message) +
                "</div>";


            if (m.reply) {

                html +=

                    "<div class='cevap'>" +

                    "<div class='cevap-baslik'>" +
                    "Cevap" +
                    "</div>" +

                    guvenli(m.reply) +

                    "</div>";

            }


            html += "</div>";

            alan.innerHTML += html;

        }


        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    })

    .catch(function(hata) {

        document.getElementById("mesajlar").innerHTML =
            "Mesajlar yüklenemedi.";

        console.log(hata);

    });

}


/* GÜVENLİ METİN */

function guvenli(metin) {

    var div =
        document.createElement("div");

    div.textContent = metin;

    return div.innerHTML;

}


/* ENTER İLE GÖNDER */

document.getElementById("mesaj")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        gonder();

    }

});


/* BAŞLANGIÇ */

mesajlariGetir();


/* 25 SANİYEDE BİR YENİLE */

setInterval(function() {

    mesajlariGetir();

}, 25000);


</script>


</body>

</html>
```
